<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Anilarper</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><style>
:root{color-scheme:dark;--bg:#080b12;--panel:#111722;--panel2:#1a2533;--line:#2a394b;--text:#f4f7fb;--muted:#9ba8b8;--violet:#9b8cff;--pink:#ff8fb8;--aqua:#68dceb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 95% 0%,#30265b55,transparent 34rem),radial-gradient(ellipse at 0% 75%,#163a4650,transparent 32rem),var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 18px 100px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 22px}.brand small{display:block;color:var(--violet);font-size:10px;letter-spacing:3px;font-weight:900}.brand h1{font-size:clamp(24px,5vw,32px);margin:0;font-weight:850;letter-spacing:-1px}.avatar,.iconbtn{border:1px solid var(--line);background:var(--panel2);color:var(--violet);border-radius:50%;width:44px;height:44px;display:grid;place-items:center}.searchbar{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:15px;background:var(--panel);color:var(--text);outline:none}.searchbar:focus{border-color:var(--violet)}.section{margin:24px 0}.heading{display:flex;align-items:center;gap:10px;margin:0 0 14px}.heading:before{content:"";width:3px;height:26px;border-radius:8px;background:linear-gradient(var(--violet),var(--pink))}.heading h2{font-size:18px;margin:0}.sub{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}.card{background:linear-gradient(145deg,#1a2533bb,#111722);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}.poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--panel2);display:block}.cardbody{padding:10px}.card h3{font-size:13px;line-height:1.3;margin:0 0 7px}.muted{color:var(--muted)}.pill{display:inline-block;padding:3px 8px;border:1px solid #9b8cff55;background:#9b8cff18;color:var(--violet);border-radius:99px;font-size:10px;font-weight:750}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 13px;border-radius:12px}.primary{background:linear-gradient(110deg,#8170ef,#d879aa);border:0;color:#080b12;font-weight:800}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.empty{border:1px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted);text-align:center}.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:center;background:#080b12f2;border-top:1px solid #9b8cff55;padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(16px)}.tabwrap{width:min(700px,100%);display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.tab{border:0;background:transparent;color:var(--muted);padding:7px 2px;border-radius:12px;font-size:11px}.tab span{display:block;font-size:19px}.tab.active{color:var(--violet);background:#9b8cff18;font-weight:800}.hidden{display:none!important}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters select,.field{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:10px;border-radius:11px}.wide{width:100%}.video{width:100%;max-height:65vh;background:#000;border-radius:15px}.stat{padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:14px;flex:1;min-width:110px}.stat strong{display:block;font-size:19px}.listrow{display:flex;gap:12px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.listrow img{width:48px;height:66px;object-fit:cover;border-radius:8px}.notice{color:var(--muted);font-size:12px;overflow-wrap:anywhere}@media(min-width:760px){.app{padding-top:28px}.grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr))}}

/* Responsive tablet and desktop layouts; preserve the original phone experience. */
@media (min-width:700px){
  .app{max-width:1440px;padding-left:28px;padding-right:28px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
  .stat{min-width:0}
  .section{margin:30px 0}
  .cardbody{padding:13px}
  .card h3{font-size:14px}
  .filters{align-items:center}
  .filters select,.field,.btn{min-height:42px}
  .coverrow{display:flex;align-items:center;gap:16px}
  .coverrow>img{width:92px;flex:0 0 92px}
}
@media (min-width:1000px){
  .app{padding-top:92px;padding-bottom:40px}
  .tabs{top:0;bottom:auto;left:0;right:0;border-top:0;border-bottom:1px solid #9b8cff55;padding:10px 28px;background:#080b12f5}
  .tabwrap{width:min(1384px,100%);grid-template-columns:repeat(5,minmax(100px,150px));justify-content:flex-start;gap:8px}
  .tab{display:flex;align-items:center;justify-content:center;gap:9px;padding:10px 15px;font-size:14px}
  .tab span{display:inline-block;font-size:19px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
  .top{margin-bottom:28px}
  .searchbar{max-width:720px}
  .video{max-height:75vh}
}
@media (min-width:1400px){
  .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media (max-width:699px){
  .app{width:100%;padding-left:14px;padding-right:14px}
}
@media (prefers-reduced-motion:no-preference){
  .card,.btn,.tab{transition:background .16s ease,border-color .16s ease,transform .16s ease}
  .card:hover{border-color:#9b8cff88}
  .btn:hover{border-color:var(--violet)}
}


/* Discover page layout and shared responsive polish. */
.discover-tools{display:grid;gap:12px;margin:12px 0 18px}
.discover-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0}
.discover-filters select,.discover-filters .field{width:100%;min-width:0;min-height:44px}
.discover-filters .year-filter{width:100%}
.discover-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:8px 0 14px}
.discover-pagination{justify-content:center;gap:12px}
.discover-grid{align-items:start}
.synopsis{line-height:1.8;max-width:900px}
@media(min-width:700px){.discover-filters{grid-template-columns:repeat(3,minmax(0,1fr))}.discover-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1000px){.discover-tools{max-width:1120px}.discover-filters{grid-template-columns:repeat(4,minmax(0,1fr))}.discover-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.discover-meta{max-width:1120px}}
@media(min-width:1400px){.discover-grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(max-width:420px){.discover-filters{grid-template-columns:1fr}.discover-meta{align-items:flex-start;flex-direction:column}}


/* Web-native shell layout: stable content widths and fluid grids. */
#page{min-width:0;width:100%;}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));}
.card{min-width:0;overflow:hidden;}
.cardbody,.card h3,.sub,.notice{overflow-wrap:anywhere;}
.poster{aspect-ratio:2/3;}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.moretile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;color:var(--text);min-width:0;}
.moretile small{color:var(--muted);}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));}.moregrid{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}.moregrid{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));}}
</style></head><body><main class="app"><header class="top"><div class="brand"><small>ANILARPER</small><h1>Your anime universe.</h1></div><button class="avatar" id="profile" aria-label="Profile">◉</button></header><div id="page"></div></main><nav class="tabs"><div class="tabwrap"><button class="tab active" data-tab="Home"><span>⌂</span>Home</button><button class="tab" data-tab="Discover"><span>⌕</span>Discover</button><button class="tab" data-tab="Library"><span>▣</span>Library</button><button class="tab" data-tab="Read"><span>▤</span>Read</button><button class="tab" data-tab="More"><span>•••</span>More</button></div></nav>
<script>
const API='https://graphql.anilist.co',MEDIA='https://anilarper-media-worker.dywone659.workers.dev';let tab='Home',library=JSON.parse(localStorage.getItem('anilarper-library')||'[]'),results=[],query='',community=[],selectedVideo=null;
const page=document.querySelector('#page');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem('anilarper-library',JSON.stringify(library));const title=a=>a.title?.english||a.title?.romaji||a.title?.native||'Untitled';const card=a=>`<article class="card"><img class="poster" loading="lazy" src="${esc(a.coverImage?.extraLarge||a.coverImage?.large||a.cover||'')}" alt=""><div class="cardbody"><h3>${esc(title(a))}</h3><div class="row"><span class="pill">${esc(a.format||'ANIME')}</span><span class="sub">${a.averageScore||a.score||'—'}%</span></div><button class="btn wide" style="margin-top:9px" onclick="toggle(${Number(a.id)})">${library.some(x=>x.id===a.id)?'✓ In library':'+ Add to library'}</button></div></article>`;
function heading(t,s=''){return `<div class="heading"><div><h2>${t}</h2>${s?`<div class="sub">${s}</div>`:''}</div></div>`}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
function toggle(id){let a=results.find(x=>x.id===id)||library.find(x=>x.id===id);if(!a)return;if(library.some(x=>x.id===id))library=library.filter(x=>x.id!==id);else library.unshift({...a,watchStatus:'PLANNING',progress:0});save();render()}
async function gql(query,variables={}){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify({query,variables})});if(!r.ok)throw Error('AniList request failed: '+r.status);return r.json()}
async function discover(q=''){page.innerHTML=heading('Discover anime','Search the AniList catalog')+`<input class="searchbar" id="q" placeholder="Search anime, genres, seasons…" value="${esc(q)}"><div class="filters"><select id="sort"><option value="TRENDING_DESC">Trending</option><option value="POPULARITY_DESC">Popular</option><option value="SCORE_DESC">Top rated</option><option value="START_DATE_DESC">Recently released</option></select><button class="btn primary" id="go">Search</button></div><div class="grid" id="results"><div class="empty">Loading anime…</div></div>`;const run=async()=>{let term=document.querySelector('#q').value;let sort=document.querySelector('#sort').value;let data=await gql(`query($search:String,$sort:[MediaSort]){Page(page:1,perPage:24){media(search:$search,type:ANIME,isAdult:false,sort:$sort){id title{romaji english native} coverImage{large extraLarge} format averageScore}}}`,{search:term||null,sort:[sort]});results=data.data.Page.media;document.querySelector('#results').innerHTML=results.map(card).join('')||'<div class="empty">No results found.</div>'};document.querySelector('#go').onclick=()=>run().catch(e=>alert(e.message));document.querySelector('#q').onkeydown=e=>{if(e.key==='Enter')run().catch(x=>alert(x.message))};await run().catch(e=>document.querySelector('#results').innerHTML='<div class="empty">'+esc(e.message)+'</div>')}
async function home(){page.innerHTML=`<input class="searchbar" id="homeSearch" placeholder="Search anime, genres, seasons…"><div class="section">${heading('Your dashboard','Keep your anime life organized')}</div><div class="row"><div class="stat"><strong>${library.length}</strong><span class="sub">In your library</span></div><div class="stat"><strong>${library.filter(x=>x.watchStatus==='COMPLETED').length}</strong><span class="sub">Completed</span></div><div class="stat"><strong>${library.filter(x=>x.isFavorite).length}</strong><span class="sub">Favorites</span></div></div><section class="section">${heading('Continue your journey','Your saved anime')}</section><div class="grid">${library.slice(0,8).map(card).join('')||'<div class="empty">Your library is waiting. Discover anime and add your first title.</div>'}</div><section class="section">${heading('Trending now','From AniList')}</section><div class="grid" id="trending"><div class="empty">Loading trending anime…</div></div>`;document.querySelector('#homeSearch').onfocus=()=>setTab('Discover');try{let d=await gql('query{Page(page:1,perPage:8){media(type:ANIME,isAdult:false,sort:TRENDING_DESC){id title{romaji english native} coverImage{large extraLarge} format averageScore}}}');results=d.data.Page.media;document.querySelector('#trending').innerHTML=results.map(card).join('')}catch(e){document.querySelector('#trending').innerHTML='<div class="empty">Could not load trending titles.</div>'}}
function libraryPage(){page.innerHTML=heading('Your Library','Your personal anime collection')+`<div class="filters"><select id="status"><option value="ALL">All statuses</option><option>PLANNING</option><option>WATCHING</option><option>COMPLETED</option><option>PAUSED</option><option>DROPPED</option></select><select id="order"><option value="added">Recently added</option><option value="title">Title A–Z</option></select></div><div id="libgrid" class="grid"></div>`;function draw(){let items=library.filter(x=>document.querySelector('#status').value==='ALL'||x.watchStatus===document.querySelector('#status').value);if(document.querySelector('#order').value==='title')items.sort((a,b)=>title(a).localeCompare(title(b)));document.querySelector('#libgrid').innerHTML=items.map(a=>`<article class="card"><img class="poster" src="${esc(a.coverImage?.large||a.cover||'')}" alt=""><div class="cardbody"><h3>${esc(title(a))}</h3><select class="field wide" onchange="updateStatus(${a.id},this.value)"><option ${a.watchStatus==='PLANNING'?'selected':''}>PLANNING</option><option ${a.watchStatus==='WATCHING'?'selected':''}>WATCHING</option><option ${a.watchStatus==='COMPLETED'?'selected':''}>COMPLETED</option><option ${a.watchStatus==='PAUSED'?'selected':''}>PAUSED</option><option ${a.watchStatus==='DROPPED'?'selected':''}>DROPPED</option></select><button class="btn wide" style="margin-top:7px" onclick="toggle(${a.id})">Remove</button></div></article>`).join('')||'<div class="empty">Nothing here yet. Add titles from Discover.</div>'}document.querySelector('#status').onchange=draw;document.querySelector('#order').onchange=draw;draw()}
function updateStatus(id,s){let a=library.find(x=>x.id===id);if(a){a.watchStatus=s;save()}}
function readPage(){page.innerHTML=heading('Read','Manga discovery')+`<p class="sub">Search manga through the Kitsu catalog.</p><input class="searchbar" id="mangaQ" placeholder="Search manga titles…"><button class="btn primary" id="mangaGo" style="margin:10px 0">Search manga</button><div id="mangaResults" class="grid"></div>`;const run=async()=>{let q=document.querySelector('#mangaQ').value.trim();if(!q)return;let box=document.querySelector('#mangaResults');box.innerHTML='<div class="empty">Searching…</div>';try{let r=await fetch('https://kitsu.io/api/edge/manga?filter[text]='+encodeURIComponent(q)+'&page[limit]=18');let j=await r.json();box.innerHTML=j.data.map(m=>`<article class="card"><img class="poster" src="${esc(m.attributes.posterImage?.large||'')}" alt=""><div class="cardbody"><h3>${esc(m.attributes.canonicalTitle)}</h3><span class="pill">${esc(m.attributes.status||'Manga')}</span><p class="sub">${esc((m.attributes.synopsis||'').slice(0,110))}…</p></div></article>`).join('')||'<div class="empty">No manga found.</div>'}catch(e){box.innerHTML='<div class="empty">Manga search unavailable right now.</div>'}};document.querySelector('#mangaGo').onclick=run;document.querySelector('#mangaQ').onkeydown=e=>{if(e.key==='Enter')run()}}
async function morePage(){page.innerHTML=heading('More','More from Anilarper')+`<div class="grid"><button class="btn" onclick="communityPage()">☁ Community videos</button><button class="btn" onclick="profilePage()">◉ Profile & settings</button><button class="btn" onclick="exportData()">⇩ Export library backup</button><button class="btn" onclick="importData()">⇧ Import library backup</button></div><section class="section">${heading('About')}</section><p class="sub">Anilarper Web · A browser companion to the Android app. Personal library data is stored in this browser.</p>`}
async function communityPage(){page.innerHTML=heading('Community Videos','Shared media library')+`<div class="row"><input class="field" id="server" style="flex:1" value="${esc(localStorage.getItem('anilarper-server')||MEDIA)}"><button class="btn primary" id="connect">Connect</button></div><p class="notice" id="communityStatus">Connect to browse shared videos.</p><div id="storageStats" class="row section"></div><input class="searchbar" id="videoSearch" placeholder="Search shared videos…"><div id="videos" class="grid section"></div><div id="playerWrap" class="section"></div>`;document.querySelector('#connect').onclick=loadVideos;document.querySelector('#videoSearch').oninput=drawVideos;await loadVideos()}
async function loadVideos(){let base=document.querySelector('#server').value.trim().replace(/\/$/,'');let status=document.querySelector('#communityStatus');status.textContent='Connecting…';try{let r=await fetch(base+'/api/videos');if(!r.ok)throw Error('Server returned '+r.status);let d=await r.json();community=d.videos||[];localStorage.setItem('anilarper-server',base);let s=d.storage||{};document.querySelector('#storageStats').innerHTML=`<div class="stat"><strong>${formatBytes(s.usedBytes||0)}</strong><span class="sub">Used</span></div><div class="stat"><strong>${formatBytes(s.maxBytes||0)}</strong><span class="sub">Capacity</span></div><div class="stat"><strong>${s.providers?.phone?.online?'Online':'—'}</strong><span class="sub">Phone storage</span></div>`;status.textContent=community.length+' shared videos available.';drawVideos()}catch(e){status.textContent='Could not connect: '+e.message;document.querySelector('#videos').innerHTML='<div class="empty">Check the server address and try again.</div>'}}
function formatBytes(n){if(!n)return'0 B';let u=['B','KB','MB','GB'];let i=Math.min(3,Math.floor(Math.log(n)/Math.log(1024)));return(n/1024**i).toFixed(1)+' '+u[i]}
function drawVideos(){let q=(document.querySelector('#videoSearch')?.value||'').toLowerCase();let list=community.filter(v=>(v.title||v.id).toLowerCase().includes(q));document.querySelector('#videos').innerHTML=list.map((v,i)=>`<article class="card"><div class="cardbody"><span class="pill">${esc(v.category||'Video')}</span><h3 style="margin-top:8px">${esc(v.title||v.id)}</h3><p class="sub">${formatBytes(v.size||0)}</p><button class="btn primary wide" onclick="playCommunity(${i})">Play</button></div></article>`).join('')||'<div class="empty">No videos found.</div>'}
function playCommunity(i){let v=community[i];if(!v)return;let base=(localStorage.getItem('anilarper-server')||MEDIA).replace(/\/$/,'');let src=base+(v.streamPath||('/media/'+encodeURIComponent(v.id)));document.querySelector('#playerWrap').innerHTML=`<h2>${esc(v.title||v.id)}</h2><video class="video" controls playsinline src="${esc(src)}"></video><p class="notice">Playback depends on the shared media server being online.</p>`;document.querySelector('#playerWrap').scrollIntoView({behavior:'smooth'})}
function profilePage(){page.innerHTML=heading('Profile','Your Anilarper web profile')+`<div class="card cardbody"><h3>Local library</h3><p class="sub">This browser currently stores ${library.length} titles. Your Android app database does not automatically sync to the website.</p><button class="btn" onclick="exportData()">Export backup</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(library,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='anilarper-library.json';a.click();URL.revokeObjectURL(a.href)}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=async()=>{try{let d=JSON.parse(await i.files[0].text());if(!Array.isArray(d))throw Error();library=d;save();render()}catch(e){alert('That backup file is not valid.')}};i.click()}
function render(){if(tab==='Home')home();else if(tab==='Discover')discover();else if(tab==='Library')libraryPage();else if(tab==='Read')readPage();else morePage()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));document.querySelector('#profile').onclick=profilePage;render();
</script><script src="app-full.js"></script>
<script src="app-discover.js"></script>
<script>if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});</script>
